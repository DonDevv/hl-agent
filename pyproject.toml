[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hl-agent"
version = "0.1.0"
description = "Autonomous, risk-managed trading agent for Hyperliquid — Senpi-compatible strategy contract, with backtesting."
requires-python = ">=3.12"
dependencies = [
    "hyperliquid-python-sdk>=0.24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "polars>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[project.scripts]
hl-agent = "hl_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["hl_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
