# ── COMPASS · 4h trend follower ──
# LONG when price sits above a rising EMA stack and breaks the recent high; SHORT mirror.
# One signal per asset per bar; the DSL owns every exit. Same contract as Senpi's runtime,
# so this package runs unmodified on either.
name: compass-main
group: compass
version: 1.0.0
description: >
  COMPASS — 4h trend following on a small liquid basket. Enter with the trend on a
  breakout of the last N bars, never against the EMA stack. Wide phase-1 floor,
  phase-2 ladder lets winners run. No prediction of tops or bottoms.

strategy:
  wallet: "${HL_WALLET}"
  slots: 2
  margin_pct: 20
  default_leverage: 2
  trading_risk: conservative
  enabled: true

scanners:
  - name: position_tracker
    type: position_tracker
    interval_seconds: 10
  - name: compass_signals
    type: external_scanner
    path: ./scanners
    entrypoint: scan.py
    interval_seconds: 900
    timeout_seconds: 120
    default_signal_validity_seconds: 1800
    state_history_max_count: 50
    inputs:
      assets: ["BTC", "ETH", "SOL"]
      interval: "4h"
      fastEma: 20
      slowEma: 50
      breakoutBars: 10
      marginPct: 20
      leverage: 2
    signal_data_schema:
      score: { type: number }
      direction: { type: string }
      reasons: { type: array, required: false }
      barTime: { type: number, required: false }

actions:
  - name: position_tracker_action
    action_type: POSITION_TRACKER
    decision_mode: rule
    scanners: [position_tracker]
  - name: compass_entry
    action_type: OPEN_POSITION
    decision_mode: rule
    scanners: [compass_signals]
    params:
      order_type: FEE_OPTIMIZED_LIMIT
      fee_optimized_limit_options:
        ensure_execution_as_taker: true
        execution_timeout_seconds: 60

exit:
  engine: dsl
  interval_seconds: 60
  dsl_preset:
    hard_timeout:
      enabled: true
      interval_in_minutes: 10080         # 7d
    weak_peak_cut:
      enabled: true
      interval_in_minutes: 1440          # 24h without ever reaching +3% ROE and fading → cut
      min_value: 3.0
    dead_weight_cut:
      enabled: false
      interval_in_minutes: 60
    phase1:
      enabled: false
      max_loss_pct: 12.0
      retrace_threshold: 12.0
      consecutive_breaches_required: 1
    phase2:
      enabled: true
      tiers:
        - { trigger_pct: 10, lock_hw_pct: 30 }
        - { trigger_pct: 20, lock_hw_pct: 50 }
        - { trigger_pct: 40, lock_hw_pct: 70 }
        - { trigger_pct: 80, lock_hw_pct: 85 }

risk:
  data_retention_seconds: 604800
  guard_rails:
    daily_loss_limit_pct: 8
    max_entries_per_day: 4
    bypass_max_entries_per_day_on_profit: false
    max_consecutive_losses: 3
    cooldown_seconds: 7200
    drawdown_halt_pct: 20
    drawdown_reset_on_day_rollover: false
    per_asset_cooldown_seconds: 14400
