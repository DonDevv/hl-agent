name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,web]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy
      - name: pytest
        shell: bash
        run: |
          set -o pipefail
          pytest -p no:warnings -rfE 2>&1 | tee pytest.log || status=$?
          { echo '```'; tail -n 80 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${status:-}" ]; then
            grep -E '^(FAILED|ERROR) ' pytest.log | head -n 8 | sed 's/^/::error title=pytest::/'
            tail -n 60 pytest.log | python -c 'import sys; t = sys.stdin.read(); print("::error title=pytest tail::" + t.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A"))'
          fi
          exit ${status:-0}
