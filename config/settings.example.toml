# Copy to config/settings.toml (git-ignored). Secrets stay in environment variables.

[network]
name = "testnet"            # "testnet" | "mainnet"

[account]
# Address of the main wallet (the one holding funds). The signing key is the
# AGENT key (trading-only, no withdraw rights) and is read from HL_AGENT_PRIVATE_KEY.
address = "0x0000000000000000000000000000000000000000"

[risk]
max_leverage = 3            # hard global cap, overrides any strategy value above it
min_notional_usd = 10.0     # Hyperliquid venue minimum

[fees]
taker_pct = 0.035
maker_pct = 0.010

[data]
cache_dir = "data/cache"
# Extra HIP-3 dexs to trade (main dex is always on). Mainnet: ["xyz"] for equities.
# Keep empty on testnet: it hosts hundreds of test dexs and listing them all hits rate limits.
dexs = []
# Where the dashboard looks for strategy packages (any dir holding a runtime.yaml, depth 3).
strategy_dirs = ["strategies", "config/strategies"]

[web]
# `hl-agent web`: bind address / port; token gates every API call when set
# (also HL_AGENT_WEB_TOKEN). Keep 127.0.0.1 and put Tailscale or a proxy in front.
host = "127.0.0.1"
port = 8080
token = ""